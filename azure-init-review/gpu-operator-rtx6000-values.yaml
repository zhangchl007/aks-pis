driver:
  enabled: false
toolkit:
  enabled: true
  env:
    - name: RUNTIME_CONFIG_SOURCE
      value: file
devicePlugin:
  enabled: true
mig:
  strategy: single
migManager:
  enabled: false
dcgmExporter:
  enabled: false
daemonsets:
  tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
nfd:
  enabled: true
node-feature-discovery:
  worker:
    nodeSelector:
      agentpool: rtxcustom
    tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
